<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}منصة الأسهم{% endblock %}</title>
<style>
  :root { --bg:#0f1419; --card:#1a2129; --line:#2a333d; --text:#e6edf3; --muted:#8b98a5; --up:#22c55e; --down:#ef4444; --accent:#3b82f6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  a { color:inherit; text-decoration:none; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  body { overflow-x:hidden; }
  nav { display:flex; gap:8px; }
  nav a { padding:8px 14px; border-radius:8px; background:var(--card); color:var(--muted); }
  nav a.active { background:var(--accent); color:#fff; }
  main { max-width:1400px; margin:0 auto; padding:16px; }
  .indices { display:flex; gap:18px; flex-wrap:wrap; align-items:center; font-size:13px; }
  .indices a { display:flex; gap:6px; align-items:baseline; }
  .indices b { font-weight:600; }
  .session { padding:4px 10px; border-radius:999px; font-size:12px; background:var(--card); border:1px solid var(--line); }
  .session.open { color:var(--up); border-color:#14532d; } .session.ext { color:#facc15; border-color:#713f12; } .session.night { color:#c4b5fd; border-color:#4c1d95; }
  .muted { color:var(--muted); font-size:13px; }
  .up { color:var(--up); } .down { color:var(--down); }
  .ltr { direction:ltr; unicode-bidi:isolate; }
</style>
<script src="{{ url_for('static', filename='price_alerts.js') }}"></script>
</head>
<body>
<header>
  <a href="/"><h1>📊 منصة الأسهم</h1></a>
  <div class="indices" id="indices"></div>
  <span class="session" id="session">—</span>
  <span class="session" id="stream-status" title="البث المباشر للأسعار من ياهو">—</span>
  <nav>
    {% if markets|length > 1 %}{% for id, m in markets.items() %}
      <a href="/market/{{ id }}" class="{{ 'active' if id == market_id }}">{{ m.title }}</a>
    {% endfor %}{% endif %}
  </nav>
</header>
<script>
// حالة السوق بتوقيت نيويورك (بدون العطل الرسمية)
function marketSession() {
  const ny = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
  const m = ny.getHours() * 60 + ny.getMinutes(), day = ny.getDay();
  // التداول الليلي (Blue Ocean ATS): 8 مساءً – 4 فجرًا، من ليلة الأحد حتى فجر الجمعة
  if ((m >= 1200 && day <= 4) || (m < 240 && day >= 1 && day <= 5)) return ["تداول ليلي", "night"];
  if (day === 0 || day === 6) return ["السوق مغلق", ""];
  if (m >= 570 && m < 960) return ["السوق مفتوح", "open"];
  if (m >= 240 && m < 570) return ["قبل الافتتاح", "ext"];
  if (m >= 960 && m < 1200) return ["بعد الإغلاق", "ext"];
  return ["السوق مغلق", ""];
}
function renderSession() {
  const [text, cls] = marketSession(), el = document.getElementById("session");
  el.textContent = text; el.className = "session " + cls;
}
async function loadIndices() {
  try {
    const list = await (await fetch("/api/indices")).json();
    document.getElementById("indices").innerHTML = list.map(i => {
      const cls = i.change_pct >= 0 ? "up" : "down", sign = i.change_pct >= 0 ? "+" : "";
      return `<a href="/stock/${encodeURIComponent(i.symbol)}"><span class="muted">${i.name}</span><b class="ltr">${i.price.toLocaleString("en-US", { maximumFractionDigits: 2 })}</b><span class="ltr ${cls}">${sign}${i.change_pct.toFixed(2)}%</span></a>`;
    }).join("");
  } catch {}
}
// حالة البيانات: تأخر الماسح أو انقطاع البث
async function loadStatus() {
  try {
    const st = await (await fetch("/api/status")).json();
    window.platformStatus = st;
    const banner = document.getElementById("stale-banner"), age = st.screener_age;
    const stale = age != null && age > 180 && marketSession()[1] !== "";
    banner.hidden = !stale;
    if (stale) banner.innerHTML = `⚠️ قائمة الأسعار من ياهو متأخرة <b>${Math.round(age / 60)} دقيقة</b> — ياهو يحد الطلبات مؤقتًا عادةً، وستعود تلقائيًا. صفحة السهم تأخذ السعر من شموع الدقيقة في هذه الأثناء.` +
      (st.screener_error ? `<div style="opacity:.7;font-size:12px;direction:ltr;text-align:left;margin-top:4px">${st.screener_error.replace(/[<>&]/g, "")}</div>` : "");
    const ss = document.getElementById("stream-status"), s = st.stream;
    const ok = s.connected && s.last_tick_age != null && s.last_tick_age < 120;
    ss.textContent = ok ? "⚡ البث متصل" : s.connected ? "⚡ البث متصل (بلا صفقات)" : "البث غير متصل";
    ss.className = "session " + (ok ? "open" : "ext");
  } catch {}
}
renderSession(); loadIndices(); loadStatus(); setInterval(loadStatus, 15000);
setInterval(renderSession, 30000); setInterval(loadIndices, 10000);
</script>
<div id="stale-banner" hidden style="margin:10px 16px 0;padding:10px 14px;border-radius:10px;background:#3d3315;border:1px solid #713f12;color:#fde68a;font-size:14px"></div>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
